name: Public demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_publication.py
      - run: npm ci && npm test && npm run lint && npm run build
        working-directory: frontend
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q tests ../research/tests
        working-directory: backend
